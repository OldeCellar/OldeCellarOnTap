name: Weekly Vol On Hand Report

on:
  schedule:
    # Every Saturday at 7:00 AM Eastern. GitHub Actions cron always runs
    # in UTC, and Eastern is UTC-4 during daylight saving (roughly March
    # to early November) and UTC-5 the rest of the year. This is set for
    # daylight saving time (11:00 UTC = 7:00 AM EDT); during standard
    # time it'll actually fire at 6:00 AM Eastern instead of 7:00.
    - cron: '0 11 * * 6'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run weekly-report.mjs
        env:
          BF_USER_ID: ${{ secrets.BF_USER_ID }}
          BF_API_KEY: ${{ secrets.BF_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          EMAIL_CC: ${{ vars.EMAIL_CC }}
        run: node scripts/weekly-report.mjs
